# Tema corporativo TRUSS & CYTILAND con modo claro y oscuro.
# Streamlit usa por defecto el tema del sistema; se cambia en el menú ⋮ (System / Light / Dark).
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#0F4C81"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#1F2937"

[theme.dark]
primaryColor = "#4C9BE8"
backgroundColor = "#0E1621"
secondaryBackgroundColor = "#16202E"
textColor = "#E6EDF5"

[server]
headless = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
